# Topology B: the gateway as a container on a dedicated gateway VM (alternative to
# the native systemd install). Host networking, so its egress rules apply to the
# VM's own interfaces exactly like the native install.
#
#   sudo docker compose -f deploy/vm/docker-compose.gateway.yml up -d --build
#
# Host paths (create them first, see README "Topology B"):
#   /etc/secretproxy/config.yaml        root:10001 0640
#   /etc/secretproxy/secrets/           root:10001 0750, files 0640 -> file:/run/secrets/<name>
#   /var/lib/secretproxy/ca/            10001:10001 0700 (from `secretproxy gen-ca`)
#   /var/log/secretproxy/               10001:10001 0750
name: secretproxy-gateway

services:
  gateway:
    image: secretproxy-gateway:latest
    build: { context: ../.., dockerfile: deploy/gateway/Dockerfile }
    network_mode: host
    restart: unless-stopped
    # Least privilege: iptables, dnsmasq on :53, dropping to the proxy user (uid 10001).
    # The same set is exercised by the routed end-to-end test.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    environment:
      MODE: routed
      SANDBOX_IFACE: eth1
      DNS_ALLOWLIST: "1"
      # DNS_UPSTREAM: "1.1.1.1 9.9.9.9"     # default: the VM's /etc/resolv.conf
    volumes:
      - /etc/secretproxy/config.yaml:/etc/secretproxy/config.yaml:ro
      - /etc/secretproxy/secrets:/run/secrets:ro
      - /var/lib/secretproxy/ca:/home/mitm/.mitmproxy
      - /var/log/secretproxy:/var/log/secretproxy
