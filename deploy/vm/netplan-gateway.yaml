# /etc/netplan/60-secretproxy.yaml on the GATEWAY VM (chmod 600; then: sudo netplan apply)
# eth0 = uplink to the internet (DHCP), eth1 = isolated sandbox network (static, no gateway).
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
    eth1:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses: [10.88.0.2/24]
