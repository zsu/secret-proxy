[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-proxy"
version = "0.1.0"
description = "Transparent secret-injection proxy for agent sandboxes (mitmproxy addon)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mitmproxy>=12.3,<13",
    "pyyaml>=6",
]

[project.scripts]
secretproxy = "secretproxy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
